name: APK bauen

# Läuft bei Änderungen an der App, bei jedem veröffentlichten Release
# und auf Knopfdruck. Bei einem Release wird die APK ans Release gehängt.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "::error::Die Secrets SIGNING_KEYSTORE_BASE64 und SIGNING_PASSWORD fehlen. Ohne sie kann kein Release gebaut werden."
            exit 1
          else
            echo "::warning::Kein Signaturschlüssel hinterlegt, die APK wird nur mit einem Testschlüssel signiert."
          fi

      - name: Versionsnummer festlegen
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="dev-${{ github.run_number }}"
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: APK bauen
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Slopeward-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Slopeward-${{ env.VERSION_NAME }}
          path: Slopeward-${{ env.VERSION_NAME }}.apk

      - name: APK ans Release hängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "Slopeward-$VERSION_NAME.apk" --clobber
