name: APK bauen

# Läuft bei Änderungen an der App und auf Knopfdruck.
# Mit einer Versionsnummer beim Start legt der Workflow das Release selbst an,
# hängt die signierte APK an und veröffentlicht es.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsnummer für ein neues Release, z. B. 1.0.0 (leer lassen für einen Testbuild)'
        required: false
        default: ''
      notes:
        description: 'Beschreibung des Releases'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          PW_RAW: ${{ secrets.SIGNING_PASSWORD }}
          IS_RELEASE: ${{ inputs.version != '' }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::Die Secrets SIGNING_KEYSTORE_BASE64 und SIGNING_PASSWORD fehlen. Ohne sie kann kein Release gebaut werden."
              exit 1
            fi
            echo "::warning::Kein Signaturschlüssel hinterlegt, die APK wird nur mit einem Testschlüssel signiert."
            exit 0
          fi
          # Leerzeichen und Zeilenumbrüche entfernen, die beim Einfügen mitrutschen können
          PW=$(printf '%s' "$PW_RAW" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          echo "::add-mask::$PW"
          if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::SIGNING_KEYSTORE_BASE64 ist beschädigt. Bitte die lange Zeile aus der Datei noch einmal komplett einfügen."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW" -alias slopeward > /dev/null 2>&1; then
            echo "::error::SIGNING_PASSWORD passt nicht zum Schlüssel. Bitte das Passwort aus der Datei noch einmal genau einfügen."
            exit 1
          fi
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "Signaturschlüssel ist in Ordnung."

      - name: Versionsnummer festlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.version }}"
          if [ -n "$TAG" ]; then
            # Schreibweisen wie "1.0.0", "V1.0.0" oder "v.1.0.0" vereinheitlichen
            V=$(printf '%s' "$TAG" | tr -d '[:space:]' | sed -E 's/^[vV]?\.?//')
            TAG="v$V"
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "::error::Version $V gibt es schon. Bitte eine neue Versionsnummer nehmen, z. B. eine höhere."
              exit 1
            fi
            echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          else
            V="dev-${{ github.run_number }}"
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: APK bauen
        run: |
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Slopeward-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Slopeward-${{ env.VERSION_NAME }}
          path: Slopeward-${{ env.VERSION_NAME }}.apk

      - name: Release veröffentlichen
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          # Erst als Entwurf anlegen und die APK anhängen, dann veröffentlichen
          gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
            --title "Slopeward $VERSION_NAME" --notes "${NOTES:-Slopeward $VERSION_NAME}"
          gh release upload "$RELEASE_TAG" "Slopeward-$VERSION_NAME.apk"
          gh release edit "$RELEASE_TAG" --draft=false --latest
          echo "Release: $(gh release view "$RELEASE_TAG" --json url -q .url)"
