<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dachschrägen-Schrankplaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Werkstattblatt – Eingaben oben, Skizze, dann Kennwerte und Zuschnittliste in einer Spalte */
:root{
  --bg:#eceff0; --paper:#f8f9f9; --ink:#1b2526; --muted:#5d6b6d; --line:#c9d1d2;
  --accent:#e2b007; --accent-ink:#1b2526; --dim:#1f6f78; --wood:#d9c7a3; --wood-edge:#a88a57; --door:#e8dcc2; --warn:#b3471d;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"Archivo",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151b1c; --paper:#1d2526; --ink:#e6ecec; --muted:#9aa8aa; --line:#33403f;
  --accent:#f0c43a; --accent-ink:#151b1c; --dim:#5fbcc6; --wood:#6b5a3c; --wood-edge:#a88a57; --door:#7d6a48; --warn:#f08a5d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151b1c; --paper:#1d2526; --ink:#e6ecec; --muted:#9aa8aa; --line:#33403f;
  --accent:#f0c43a; --accent-ink:#151b1c; --dim:#5fbcc6; --wood:#6b5a3c; --wood-edge:#a88a57; --door:#7d6a48; --warn:#f08a5d; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding-block:max(20px,env(safe-area-inset-top,0px)) 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
header>div{min-width:0;flex:1 1 280px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:600;font-size:1.05rem;margin:0 0 10px;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:62ch}
.lang{display:flex;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:3px}
.lang button{background:transparent;color:var(--muted);padding:6px 9px;font:600 .8rem var(--f-mono);border-radius:5px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
section{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.in{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.in:focus-within{outline:2px solid var(--dim);outline-offset:1px}
input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:600 1rem var(--f-mono);padding:8px 10px;outline:none}
.u{padding-right:10px;font:400 .8rem var(--f-mono);color:var(--muted);text-transform:none;letter-spacing:0}
.group-t{font-size:.8rem;font-weight:600;color:var(--ink);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px}
.seg button{background:transparent;color:var(--muted);border-radius:5px;padding:10px 8px;line-height:1.25}
.seg button small{display:block;font-weight:400;font-size:.75rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{border-left:3px solid var(--accent);padding:4px 0 4px 10px}
.kpi b{display:block;font:600 1.35rem var(--f-mono);font-variant-numeric:tabular-nums}
.kpi span{font-size:.78rem;color:var(--muted)}
.svgbox{overflow-x:auto}
svg{display:block;width:100%;height:auto;max-width:100%}
svg text{font-family:var(--f-mono);font-size:11px;fill:var(--ink)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.m{font-family:var(--f-mono)}
td.q{font-family:var(--f-mono);white-space:nowrap}
td.m{min-width:9ch}
td:nth-child(2){min-width:12ch}
td small{color:var(--muted);display:block}
.warn{color:var(--warn);font-weight:600;margin:10px 0 0}
.warn:empty{display:none}
button{font:600 .9rem var(--f-body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:9px 14px;cursor:pointer}
button:focus-visible{outline:2px solid var(--dim);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.note{font-size:.85rem;color:var(--muted);margin:10px 0 0}
ul.steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:.72rem;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted);margin-left:6px;vertical-align:middle;text-transform:none;letter-spacing:0;font-weight:400}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button type="button" data-lang="de">DE</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="fr">FR</button>
      <button type="button" data-lang="es">ES</button>
    </div>
  </header>

  <section>
    <div class="group-t" style="margin-top:0" data-t="where"></div>
    <div class="seg" role="group">
      <button type="button" id="mG" aria-pressed="true"><span data-t="modeG"></span><small data-t="modeGs"></small></button>
      <button type="button" id="mK" aria-pressed="false"><span data-t="modeK"></span><small data-t="modeKs"></small></button>
    </div>

    <div class="group-t"><span data-t="room"></span> <span class="tag" id="ex" data-t="example"></span></div>
    <div class="grid">
      <label for="h1"><span data-t="h1"></span><div class="in"><input id="h1" type="number" step="0.1" inputmode="decimal" value="100"><span class="u">cm</span></div></label>
      <label for="h2"><span data-t="h2"></span><div class="in"><input id="h2" type="number" step="0.1" inputmode="decimal" value="250"><span class="u">cm</span></div></label>
      <label for="d"><span data-t="d"></span><div class="in"><input id="d" type="number" step="0.1" inputmode="decimal" value="260"><span class="u">cm</span></div></label>
    </div>
    <div class="group-t" data-t="cab"></div>
    <div class="grid">
      <label for="W"><span data-t="W"></span><div class="in"><input id="W" type="number" step="0.1" inputmode="decimal" value="200"><span class="u">cm</span></div></label>
      <label for="T"><span data-t="T"></span><div class="in"><input id="T" type="number" step="0.1" inputmode="decimal" value="60"><span class="u">cm</span></div></label>
      <label for="n"><span data-t="n"></span><div class="in"><input id="n" type="number" step="1" min="1" inputmode="numeric" value="4"><span class="u" data-t="pcs"></span></div></label>
      <label for="o"><span data-t="o"></span><div class="in"><input id="o" type="number" step="0.1" inputmode="decimal" value="0"><span class="u">cm</span></div></label>
    </div>
    <div class="group-t" data-t="mat"></div>
    <div class="grid">
      <label for="m"><span data-t="m"></span><div class="in"><input id="m" type="number" step="0.1" inputmode="decimal" value="1.9"><span class="u">cm</span></div></label>
      <label for="s"><span data-t="s"></span><div class="in"><input id="s" type="number" step="0.1" inputmode="decimal" value="8"><span class="u">cm</span></div></label>
      <label for="f"><span data-t="f"></span><div class="in"><input id="f" type="number" step="0.1" inputmode="decimal" value="1"><span class="u">cm</span></div></label>
      <label for="fu"><span data-t="fu"></span><div class="in"><input id="fu" type="number" step="0.1" inputmode="decimal" value="0.3"><span class="u">cm</span></div></label>
    </div>
  </section>

  <section>
    <h2 data-t="slope"></h2>
    <div class="kpis">
      <div class="kpi"><b id="kA">–</b><span data-t="kA"></span></div>
      <div class="kpi"><b id="kP">–</b><span data-t="kP"></span></div>
      <div class="kpi"><b id="kL">–</b><span data-t="kL"></span></div>
      <div class="kpi"><b id="kM">–</b><span data-t="kM"></span></div>
    </div>
    <div class="grid" style="margin-top:14px">
      <label for="qx"><span data-t="qx"></span><div class="in"><input id="qx" type="number" step="0.1" inputmode="decimal" value="60"><span class="u">cm</span></div></label>
      <div class="kpi" style="align-self:end"><b id="qy">–</b><span data-t="qy"></span></div>
    </div>
  </section>

  <section>
    <h2 id="picT"></h2>
    <div class="svgbox"><svg id="pic" viewBox="0 0 640 360" role="img"></svg></div>
    <p class="warn" id="warn"></p>
  </section>

  <section>
    <h2 data-t="angles"></h2>
    <ul class="steps" id="angles"></ul>
  </section>

  <section>
    <div class="row"><h2 style="margin:0" data-t="cut"></h2><button id="copy" type="button" data-t="copy"></button></div>
    <div class="tbl" style="margin-top:10px"><table>
      <thead><tr><th data-t="thQ"></th><th data-t="thP"></th><th data-t="thD"></th></tr></thead>
      <tbody id="cut"></tbody>
    </table></div>
    <p class="note" id="build"></p>
    <p class="note" data-t="measure"></p>
  </section>
</div>

const ids=["h1","h2","d","W","T","n","o","m","s","f","fu","qx"];
const $=i=>document.getElementById(i);
let mode="G", lang=null, lastText="";
try{const sv=JSON.parse(localStorage.getItem("dsp")||"null");if(sv){ids.forEach(i=>{if(sv[i]!=null)$(i).value=sv[i]});if(sv.mode)mode=sv.mode;$("ex").hidden=true}}catch(e){}
try{lang=localStorage.getItem("dsp_lang")}catch(e){}
if(!L[lang]){const nl=(navigator.language||"de").slice(0,2).toLowerCase();lang=L[nl]?nl:"en"}
const t=(k,v)=>{let s=L[lang][k];if(v)for(const x in v)s=s.split("{"+x+"}").join(v[x]);return s};
const mm=v=>Math.round(v*10).toLocaleString(L[lang].loc)+"\u00a0mm";
const n1=v=>v.toLocaleString(L[lang].loc,{maximumFractionDigits:1});
function setLang(l){
  lang=l;try{localStorage.setItem("dsp_lang",l)}catch(e){}
  document.documentElement.lang=l;document.title=t("title");
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
  calc();
}
function setMode(m){mode=m;$("mG").setAttribute("aria-pressed",m==="G");$("mK").setAttribute("aria-pressed",m==="K");calc()}
function calc(){
  const v={};ids.forEach(i=>v[i]=parseFloat($(i).value)||0);
  try{localStorage.setItem("dsp",JSON.stringify({...Object.fromEntries(ids.map(i=>[i,$(i).value])),mode}))}catch(e){}
  const {h1,h2,d,W,T,o,m,s,f,fu}=v; const n=Math.max(1,Math.round(v.n));
  const dh=h2-h1; if(d<=0||dh<=0){$("warn").textContent=t("errIn");return}
  const a=Math.atan(dh/d), deg=a*180/Math.PI, tn=Math.tan(a), cs=Math.cos(a);
  $("kA").textContent=n1(deg)+"°";$("kP").textContent=n1(tn*100)+" %";$("kL").textContent=mm(Math.hypot(d,dh));$("kM").textContent=mm(10*tn);
  $("qy").textContent=mm(Math.min(h1+v.qx*tn,h2));
  const top=x=>h1+x*tn-f, dv=m/cs, warn=[];
  const D=n1(deg), A={deg:D,a1:n1(90-deg),a2:n1(90+deg),c:n1(90-deg)};
  let parts, angles, build;
  if(mode==="G"){
    if(o+W>d)warn.push(t("wG1"));
    const pitch=(W-m)/n;
    const walls=[]; for(let i=0;i<=n;i++){const x=o+i*pitch;walls.push({x,lo:top(x)-s-m-dv,hi:top(x)-s-m-dv+m*tn})}
    if(walls[0].lo<=0)warn.push(t("wG2"));
    const iw=pitch-m, dw=(W-(n+1)*fu)/n;
    parts=walls.map((w,i)=>[1,i===0?t("sideL"):i===n?t("sideR"):t("mid",{i}),`${mm(T)} × ${mm(w.lo)}`,t("wallNote",{deg:D,hi:mm(w.hi)})]);
    parts.push([1,t("bottom"),`${mm(W)} × ${mm(T)}`,t("bottomG")]);
    parts.push([1,t("top"),`${mm(W/cs)} × ${mm(T)}`,t("topG",{deg:D})]);
    for(let i=0;i<n;i++){const xl=o+i*(dw+fu)+fu, xr=xl+dw;parts.push([1,t("doorN",{i:i+1}),t("doorDim",{w:mm(dw),l:mm(top(xl)-s-fu),r:mm(top(xr)-s-fu)}),t("doorNoteG",{deg:D})])}
    for(let i=0;i<n;i++){parts.push([1,t("shelfN",{i:i+1}),`${mm(iw-0.1)} × ${mm(T-2)}`,t("shelfNoteG",{h:mm(walls[i].lo+s+m-2)})])}
    parts.push([1,t("plinth"),`${mm(W)} × ${mm(s)}`,""]);
    parts.push([1,t("backG"),t("backGdim",{w:mm(W-0.2),l:mm(top(o)-s-0.2),r:mm(top(o+W)-s-0.2)}),t("backGnote")]);
    angles=L[lang].aG.map(x=>tpl(x,A));
    build=t("buildG");
    $("picT").textContent=t("picG");
    drawG(v,a,tn,top,n);
  } else {
    if(o+T>d)warn.push(t("wK1"));
    const sh=top(o)-s-m-dv, sv=top(o+T)-s-m-dv, iw=(W-(n+1)*m)/n, dw=(W-(n+1)*fu)/n, dhgt=top(o+T)-s-fu, sl=T/cs;
    if(sh<=0)warn.push(t("wK2"));
    const td=t("trapDim",{t:mm(T),b:mm(sh),f:mm(sv)});
    parts=[
      [2,t("sideTrap"),td,t("sideNoteK",{l:mm(sl)})],
      ...(n>1?[[n-1,t("midTrap"),td,t("sameSide")]]:[]),
      [1,t("bottom"),`${mm(W)} × ${mm(T)}`,t("bottomK")],
      [1,t("top"),`${mm(W)} × ${mm(sl)}`,t("topK",{deg:D})],
      [n,t("door"),`${mm(dw)} × ${mm(dhgt)}`,t("doorNoteK")],
      [n,t("shelf"),`${mm(iw-0.1)} × ${mm(T-2)}`,t("shelfNoteK",{h:mm(sh+s+m)})],
      [1,t("plinth"),`${mm(W)} × ${mm(s)}`,""],
      [1,t("backK"),`${mm(W-0.2)} × ${mm(top(o)-s-0.2)}`,t("backKnote")]
    ];
    angles=L[lang].aK.map(x=>tpl(x,{...A,b:mm(sh),f:mm(sv)}));
    build=t("buildK");
    $("picT").textContent=t("picK");
    drawK(v,a,tn,top);
  }
  $("warn").textContent=warn.join(" ");
  $("cut").innerHTML=parts.map(p=>`<tr><td class="q">${p[0]}×</td><td>${p[1]}${p[3]?`<small>${p[3]}</small>`:""}</td><td class="m">${p[2].split(" · ").join(" ·<wbr> ")}</td></tr>`).join("");
  $("angles").innerHTML=angles.map(x=>`<li>${x}</li>`).join("");
  $("build").textContent=build;
  lastText=t("head",{deg:D,h1:n1(h1),h2:n1(h2),d:n1(d),mode:t(mode==="G"?"modeGn":"modeKn")})+"\n"+parts.map(p=>`${p[0]}x ${p[1]}: ${p[2]}${p[3]?" ("+p[3]+")":""}`).join("\n");
}
function tpl(s,v){for(const x in v)s=s.split("{"+x+"}").join(v[x]);return s}
function frame(v,extent){
  const Wv=640,Hv=360,pad=48, span=extent*1.08, sc=Math.min((Wv-pad*2)/span,(Hv-pad*1.6)/v.h2);
  return {X:x=>pad+x*sc,Y:y=>Hv-30-y*sc,span};
}
function roofAndDims(g,v,a,tn,X,Y,span){
  const {h1,h2,d}=v;
  g.push(`<line x1="${X(0)-20}" y1="${Y(0)}" x2="${X(span)}" y2="${Y(0)}" stroke="var(--ink)" stroke-width="1.5"/>`);
  g.push(`<polyline points="${X(0)},${Y(0)} ${X(0)},${Y(h1)} ${X(d)},${Y(h2)} ${X(span)},${Y(h2)}" fill="none" stroke="var(--ink)" stroke-width="2.5"/>`);
  const dimV=(x,y1,lbl,side)=>{const xx=X(x)+side*10;return `<line x1="${xx}" y1="${Y(0)}" x2="${xx}" y2="${Y(y1)}" stroke="var(--dim)"/><text x="${xx+side*4}" y="${(Y(0)+Y(y1))/2}" text-anchor="${side<0?"end":"start"}" dominant-baseline="middle" style="fill:var(--dim)">${lbl}</text>`};
  g.push(dimV(0,h1,n1(h1)+" cm",-1)); g.push(dimV(d,h2,n1(h2)+" cm",1));
  g.push(`<line x1="${X(0)}" y1="${Y(0)+16}" x2="${X(d)}" y2="${Y(0)+16}" stroke="var(--dim)"/><text x="${(X(0)+X(d))/2}" y="${Y(0)+28}" text-anchor="middle" style="fill:var(--dim)">${n1(d)} cm</text>`);
  const r=34, ax=X(d*0.62), ay=Y(h1+d*0.62*tn);
  g.push(`<path d="M${ax+r},${ay} A${r},${r} 0 0 0 ${ax+r*Math.cos(a)},${ay-r*Math.sin(a)}" fill="none" stroke="var(--accent)" stroke-width="2.5"/><line x1="${ax}" y1="${ay}" x2="${ax+r+14}" y2="${ay}" stroke="var(--accent)" stroke-dasharray="3 3"/><text x="${ax+r+18}" y="${ay-6}" style="font-weight:600">${n1(a*180/Math.PI)}°</text>`);
}
function drawG(v,a,tn,top,n){
  const {d,W,o,s,fu}=v, {X,Y,span}=frame(v,Math.max(d,o+W)), g=[];
  roofAndDims(g,v,a,tn,X,Y,span);
  const x0=o,x1=o+W;
  g.push(`<polygon points="${X(x0)},${Y(0)} ${X(x0)},${Y(top(x0))} ${X(x1)},${Y(top(x1))} ${X(x1)},${Y(0)}" fill="var(--wood)" stroke="var(--wood-edge)" stroke-width="1.5"/>`);
  g.push(`<line x1="${X(x0)}" y1="${Y(s)}" x2="${X(x1)}" y2="${Y(s)}" stroke="var(--wood-edge)"/>`);
  const dw=(W-(n+1)*fu)/n;
  for(let i=0;i<n;i++){const xl=o+i*(dw+fu)+fu,xr=xl+dw;g.push(`<polygon points="${X(xl)},${Y(s+fu/2)} ${X(xl)},${Y(top(xl)-fu)} ${X(xr)},${Y(top(xr)-fu)} ${X(xr)},${Y(s+fu/2)}" fill="var(--door)" stroke="var(--wood-edge)"/>`);
    g.push(`<text x="${(X(xl)+X(xr))/2}" y="${Y(s)-12}" text-anchor="middle">${i+1}</text>`)}
  g.push(`<text x="${(X(x0)+X(x1))/2}" y="${Y(0)-2}" text-anchor="middle" dy="-0.2em" style="font-size:10px;fill:var(--muted)">${t("wAbbr")} ${n1(W)} cm</text>`);
  $("pic").innerHTML=g.join("");
}
function drawK(v,a,tn,top){
  const {d,T,o,s,m}=v, {X,Y,span}=frame(v,Math.max(d,o+T)), g=[];
  roofAndDims(g,v,a,tn,X,Y,span);
  const x0=o,x1=o+T;
  g.push(`<polygon points="${X(x0)},${Y(0)} ${X(x0)},${Y(top(x0))} ${X(x1)},${Y(top(x1))} ${X(x1)},${Y(0)}" fill="var(--wood)" stroke="var(--wood-edge)" stroke-width="1.5"/>`);
  g.push(`<line x1="${X(x0)}" y1="${Y(s)}" x2="${X(x1)}" y2="${Y(s)}" stroke="var(--wood-edge)"/>`);
  g.push(`<line x1="${X(x0)}" y1="${Y(s+m)}" x2="${X(x1)}" y2="${Y(s+m)}" stroke="var(--wood-edge)"/>`);
  g.push(`<text x="${(X(x0)+X(x1))/2}" y="${Y(top(x0)/2)}" text-anchor="middle" style="font-weight:600">${t("cabinet")}</text><text x="${(X(x0)+X(x1))/2}" y="${Y(top(x0)/2)+14}" text-anchor="middle">${t("dAbbr")} ${n1(T)} cm</text>`);
  $("pic").innerHTML=g.join("");
}
ids.forEach(i=>$(i).addEventListener("input",()=>{$("ex").hidden=true;calc()}));
$("mG").addEventListener("click",()=>setMode("G"));
$("mK").addEventListener("click",()=>setMode("K"));
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
$("copy").addEventListener("click",async()=>{const b=$("copy");try{if(window.Android){Android.copy(lastText,t("copied"))}else{await navigator.clipboard.writeText(lastText)}b.textContent=t("copied")}catch(e){b.textContent=t("copyFail")}setTimeout(()=>b.textContent=t("copy"),1800)});
setMode(mode);
setLang(lang);
</script>
